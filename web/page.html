<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tom-ps5-usbnet</title>
<style>
:root{color-scheme:light;--bg:#f2f5f8;--panel:#fff;--raised:#f7f9fb;--line:#e1e7ee;--fg:#101d2e;--mut:#5c6b7f;--faint:#8a97a8;--accent:#0a7c8c;--accent-soft:#dff3f4;--accent-fg:#fff;--danger:#c0362c;--danger-soft:#fdeceb;--ok:#14804a;--warn:#a86400;--sel:#e4f4f6;--bar:#e6ebf1;--shadow:0 1px 2px rgba(16,29,46,.05),0 8px 24px rgba(16,29,46,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0b111d;--panel:#131b2b;--raised:#182235;--line:#253148;--fg:#e8eef7;--mut:#94a3ba;--faint:#6d7c94;--accent:#2fc4c8;--accent-soft:#12343c;--accent-fg:#06222a;--danger:#ff7b70;--danger-soft:#3a1a1c;--ok:#4fd08c;--warn:#f0b24c;--sel:#14303a;--bar:#253148;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b111d;--panel:#131b2b;--raised:#182235;--line:#253148;--fg:#e8eef7;--mut:#94a3ba;--faint:#6d7c94;--accent:#2fc4c8;--accent-soft:#12343c;--accent-fg:#06222a;--danger:#ff7b70;--danger-soft:#3a1a1c;--ok:#4fd08c;--warn:#f0b24c;--sel:#14303a;--bar:#253148;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--faint);background:var(--raised)}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.42;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
button.danger{color:var(--danger)}
button.danger:hover:not(:disabled){background:var(--danger-soft);border-color:var(--danger)}
button.quiet{border-color:transparent;background:transparent}
button.quiet:hover:not(:disabled){background:var(--raised)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand svg{width:30px;height:30px;border-radius:8px;display:block}
nav{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px}
nav button{border:0;background:transparent;padding:5px 16px;color:var(--mut);border-radius:7px}
nav button:hover:not(:disabled){background:transparent;color:var(--fg)}
nav button[aria-selected=true]{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(16,29,46,.12)}
.chips{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--mut);font-size:12px;border:0}
.chip b{color:var(--fg);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--ok)}.dot.off{background:var(--danger)}
main{flex:1;min-height:0;display:flex}
.view{flex:1;min-width:0;display:none}
.view.on{display:flex}
aside{width:262px;flex:none;padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;border-right:1px solid var(--line)}
aside h2{margin:2px 4px 2px;font-size:12px;font-weight:600;color:var(--mut)}
.vol{display:block;width:100%;min-width:0;text-align:left;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.vol.on{border-color:var(--accent);background:var(--sel)}
.vol-top{display:flex;align-items:center;gap:8px;font-weight:600}
.vol-top svg{color:var(--accent)}
.vol-sub{color:var(--mut);font-size:12px;margin:1px 0 7px;display:flex;justify-content:space-between;gap:6px}
.vol-sub span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.usage{height:6px;border-radius:3px;background:var(--bar);overflow:hidden}
.usage i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.usage i.full{background:var(--danger)}
.vol-foot{color:var(--mut);font-size:12px;margin-top:5px}
.workspace{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 16px;gap:10px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar .gap{flex:1}
.search{display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:170px}
.search input{border:0;outline:0;background:transparent;padding:6px 0;width:100%}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-height:30px}
.crumbs button{border:0;background:transparent;padding:3px 6px;color:var(--mut)}
.crumbs button:last-child{color:var(--fg);font-weight:600}
.crumbs span{color:var(--faint)}
.list{flex:1;min-height:180px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:var(--shadow);position:relative}
table{border-collapse:collapse;width:100%}
.list table{table-layout:fixed}
.list th{position:sticky;top:0;z-index:1;background:var(--panel);color:var(--mut);font-weight:500;text-align:left;font-size:12px;padding:0;border-bottom:1px solid var(--line)}
.list th button{border:0;background:transparent;border-radius:0;width:100%;padding:8px 10px;color:inherit;font-weight:500;justify-content:flex-start}
.list th.r button{justify-content:flex-end}
.list td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list tr:last-child td{border-bottom:0}
.list tbody tr{cursor:default;content-visibility:auto;contain-intrinsic-size:auto 37px}
.list tbody tr:hover{background:var(--raised)}
.list tbody tr.on{background:var(--sel)}
.c-check{width:38px}.c-size{width:110px}.c-time{width:150px}
.r{text-align:right}
.mut{color:var(--mut)}
.nm{display:flex;align-items:center;gap:9px;min-width:0}
.nm svg{color:var(--faint)}
.nm svg.folder{color:#d9a21b;fill:#f4c95d;stroke:#d9a21b}
.nm a,.nm>span:not(.link-tag){color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis}
.nm a:hover{color:var(--accent);text-decoration:underline}
.link-tag{font-size:11px;padding:0 6px;border-radius:5px;background:var(--bar);color:var(--mut)}
input[type=checkbox]{width:15px;height:15px;margin:0;accent-color:var(--accent);vertical-align:middle}
.empty{padding:48px 20px;text-align:center;color:var(--mut)}
.empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:8px;stroke-width:1.3}
.status{display:flex;justify-content:space-between;gap:12px;color:var(--mut);font-size:12px;padding:0 4px}
.drop{position:fixed;inset:0;z-index:30;background:rgba(10,124,140,.14);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;pointer-events:none}
.drop.on{display:flex}
.drop div{background:var(--panel);border:2px dashed var(--accent);border-radius:16px;padding:30px 44px;text-align:center;box-shadow:var(--shadow);font-size:16px;font-weight:600}
.drop .mono{display:block;color:var(--mut);font-weight:400;margin-top:6px}
.dock{flex:none;background:var(--panel);border-top:1px solid var(--line);display:none}
.dock.on{display:block}
.meter{display:grid;grid-template-columns:minmax(210px,auto) 1fr auto;gap:18px;align-items:center;padding:12px 18px;background:linear-gradient(115deg,#13294f,#0a7c8c);color:#fff}
.speed{display:flex;align-items:baseline;gap:6px}
.speed b{font-size:36px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.speed span{opacity:.85}
.gbit{font-size:12px;opacity:.82}
.meter canvas{width:100%;height:52px;display:block}
.meter .stats{font-size:12px;line-height:1.7;text-align:right;white-space:nowrap}
.meter .stats b{font-weight:600}
.meter button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26);color:#fff}
.meter button:hover:not(:disabled){background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.4)}
.overall{height:3px;background:rgba(255,255,255,.2)}
.overall i{display:block;height:100%;width:0;background:#7ce7e3;transition:width .25s}
.tasks{max-height:178px;overflow-y:auto}
.tasks table{table-layout:fixed;font-size:13px}
.tasks td{padding:5px 18px 5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line)}
.tasks td:first-child{padding-left:18px}
.tasks .bar{height:4px;border-radius:2px;background:var(--bar);overflow:hidden}
.tasks .bar i{display:block;height:100%;background:var(--accent);width:0}
.t-state{width:150px}.t-size{width:92px}.t-rate{width:128px}.t-sync{width:96px}.t-prog{width:170px}.t-act{width:48px}
.good{color:var(--ok)}.bad{color:var(--danger)}.warn{color:var(--warn)}
.back{position:fixed;inset:0;z-index:40;background:rgba(6,12,22,.5);display:none;align-items:center;justify-content:center;padding:16px}
.back.on{display:flex}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.35);width:100%;max-width:460px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{max-width:600px}
.modal h3{margin:0;padding:16px 18px 4px;font-size:16px}
.modal .body{padding:8px 18px 12px;overflow-y:auto;color:var(--mut)}
.modal .body input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--fg)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px;flex-wrap:wrap}
.names{margin:8px 0 0;padding:8px 10px;background:var(--raised);border-radius:8px;max-height:150px;overflow:auto;color:var(--fg);font-size:13px;word-break:break-all}
.names div{padding:1px 0}
.picker{border:1px solid var(--line);border-radius:10px;margin-top:8px;height:260px;overflow-y:auto}
.picker button{display:flex;width:100%;border:0;border-radius:0;background:transparent;padding:7px 12px;text-align:left}
.picker button:hover:not(:disabled){background:var(--raised)}
.picker .folder{color:#d9a21b;fill:#f4c95d}
.menu{position:fixed;z-index:35;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.2);padding:4px;min-width:170px;display:none}
.menu.on{display:block}
.menu button{display:flex;width:100%;border:0;background:transparent;border-radius:6px;padding:6px 10px}
.menu button:hover:not(:disabled){background:var(--raised)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.toasts{position:fixed;right:16px;top:60px;z-index:50;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 13px;box-shadow:var(--shadow);word-break:break-word}
.toast.bad{border-left-color:var(--danger);color:var(--fg)}
.bench{flex:1;min-width:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;max-width:1100px;margin:0 auto;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:16px}
.card p{margin:4px 0;color:var(--mut)}
.bench-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.scroll{overflow-x:auto}
#disk-rows td,.bench th{padding:5px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.bench th{color:var(--mut);font-weight:500;font-size:12px}
#disk-rows td:first-child,.bench th:first-child,#disk-rows td:last-child,.bench th:last-child{text-align:left}
#net b{color:var(--accent);font-weight:700}
#net .off-rate{color:var(--mut)}
.ended{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
.ended.on{display:flex}
.ended h2{margin:0 0 8px}
.ended p{color:var(--mut);margin:4px 0}
@media (max-width:860px){
main{flex-direction:column}
.view.on{flex-direction:column}
aside{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px;flex:none}
aside h2{display:none}
.vol{min-width:210px}
.workspace{padding:10px 16px}
.c-time,.t-sync,.t-prog{display:none}
td.t-time,td.t-sync,td.t-prog{display:none}
.meter{grid-template-columns:1fr auto}.meter canvas{display:none}
.chips{margin-left:0}
.t-size{width:62px}.t-rate{width:72px}.t-state{width:64px}.t-act{width:28px}.tasks td{padding-right:8px}
header{padding:10px 16px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 6 .4l3-3a4 4 0 0 0-5.7-5.7L12 7"/><path d="M14 10a4 4 0 0 0-6-.4l-3 3a4 4 0 0 0 5.7 5.7L12 17"/></symbol>
<symbol id="drive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 14h18M7.5 17h.01M11 17h.01"/></symbol>
<symbol id="chip" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 16v2M11 16v2M15 16v2M7 12h.01M16 11h2v2h-2z"/></symbol>
<symbol id="usb" viewBox="0 0 24 24"><path d="M12 3v15M12 3l-2 3h4zM12 13l-4-2V9M12 15l4-2v-2"/><circle cx="12" cy="19.5" r="1.7"/><rect x="6.8" y="7" width="2.4" height="2.4"/><circle cx="16" cy="10" r="1.2"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M4 19h16"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M4 19h16"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
<symbol id="copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4V5a1 1 0 0 1 1-1h10v1"/></symbol>
<symbol id="move" viewBox="0 0 24 24"><path d="M3 12h13M12 7l5 5-5 5M20 5v14"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M19 11a7.5 7.5 0 0 0-13-3M5 13a7.5 7.5 0 0 0 13 3"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></symbol>
<symbol id="power" viewBox="0 0 24 24"><path d="M12 4v8M7 7a7 7 0 1 0 10 0"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</defs></svg>

<header>
<div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#142c5c"/><stop offset="1" stop-color="#088a96"/></linearGradient></defs><rect width="64" height="64" fill="url(#g)"/><path d="M10 22a4 4 0 0 1 4-4h16v8H10z" fill="#cdd8e4"/><rect x="10" y="22" width="44" height="29" rx="4" fill="#f4f7fa"/><path d="M38 22 27 36h6l-5 13 14-17h-7l5-10z" fill="#ffc42c"/></svg>tom-ps5-usbnet</div>
<nav role="tablist"><button role="tab" id="tab-files" aria-selected="true">文件</button><button role="tab" id="tab-bench" aria-selected="false">硬盘测速</button></nav>
<div class="chips">
<span class="chip"><i class="dot" id="net-dot"></i><span id="net">正在连接…</span></span>
<button class="chip" id="tile-chip" title="主机主屏幕上的图标"><svg class="i"><use href="#info"/></svg><span id="tile-text">图标</span></button>
<button class="quiet" id="theme" title="切换深浅色" aria-label="切换深浅色"><svg class="i"><use href="#moon"/></svg></button>
<button class="danger" id="end"><svg class="i"><use href="#power"/></svg>退出</button>
</div>
</header>

<main>
<section class="view on" id="view-files">
<aside><h2>存储位置</h2><div id="vols" style="display:contents"></div></aside>
<div class="workspace">
<div class="toolbar">
<button class="primary" id="up-files"><svg class="i"><use href="#up"/></svg>上传文件</button>
<button id="up-folder"><svg class="i"><use href="#up"/></svg>上传文件夹</button>
<button id="mkdir"><svg class="i"><use href="#plus"/></svg>新建文件夹</button>
<span style="width:6px"></span>
<button id="act-down" disabled><svg class="i"><use href="#down"/></svg>下载</button>
<button id="act-rename" disabled><svg class="i"><use href="#edit"/></svg>重命名</button>
<button id="act-copy" disabled><svg class="i"><use href="#copy"/></svg>复制到</button>
<button id="act-move" disabled><svg class="i"><use href="#move"/></svg>移动到</button>
<button id="act-del" class="danger" disabled><svg class="i"><use href="#trash"/></svg>删除</button>
<span class="gap"></span>
<label class="search"><svg class="i"><use href="#search"/></svg><input id="filter" placeholder="筛选当前文件夹" aria-label="筛选当前文件夹"></label>
<button class="quiet" id="refresh" title="刷新" aria-label="刷新"><svg class="i"><use href="#refresh"/></svg></button>
</div>
<div class="crumbs" id="crumbs"></div>
<div class="list" id="list" tabindex="0">
<table><thead><tr><th class="c-check"><div style="padding:0 10px"><input type="checkbox" id="all" aria-label="全选"></div></th>
<th><button data-sort="name" id="s-name">名称</button></th>
<th class="c-size r"><button data-sort="size" id="s-size">大小</button></th>
<th class="c-time r"><button data-sort="mtime" id="s-mtime">修改时间</button></th></tr></thead>
<tbody id="items"></tbody></table>
<div class="empty" id="empty" hidden></div>
</div>
<div class="status"><span id="count"></span><span>拖入即可上传</span></div>
</div>
</section>

<section class="view" id="view-bench">
<div class="bench">
<div class="card">
<h2>硬盘测速</h2>
<p>写入并读回 2 GiB 临时文件，完成后删除。</p>
<div class="bench-actions"><button class="primary" id="disk-go"><svg class="i"><use href="#drive"/></svg>测硬盘速度</button><span id="disk-state" class="mut"></span></div>
<div class="scroll"><table><thead><tr><th>硬盘</th><th>写入</th><th>读取</th><th>说明</th></tr></thead><tbody id="disk-rows"></tbody></table></div>
</div>
</div>
</section>
</main>

<div class="dock" id="dock">
<div class="meter">
<div><div class="speed"><b id="rate">0</b><span>MB/s</span></div><div class="gbit" id="gbit">0.00 Gbit/s</div></div>
<canvas id="spark" height="52"></canvas>
<div class="stats"><div id="st-now">—</div><div id="st-sum">—</div><button id="dock-close" hidden><svg class="i"><use href="#x"/></svg>收起</button> <button id="cancel-all" hidden>全部取消</button></div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};

const ERRORS={not_found:'找不到这个文件或文件夹',exists:'同名项目已经存在',not_empty:'文件夹不是空的',no_space:'目标硬盘空间不够',denied:'主机拒绝了这个操作',read_only:'这个位置是只读的',other_volume:'不能跨硬盘改名',name_too_long:'名字太长',is_folder:'这是文件夹',not_folder:'这不是文件夹',busy:'正在被占用',failed:'操作失败',bad_path:'这个路径不允许操作',into_itself:'不能放进它自己里面',job_running:'已有一个复制或移动在进行',no_memory:'主机内存不足',no_thread:'主机无法启动任务',source_kept:'已复制到新位置，但删除原文件失败',length_required:'缺少长度',bad_range:'范围无效'};
const say_error=code=>ERRORS[code]||code||'操作失败';
const S={volumes:[],path:'',entries:[],selected:new Set(),anchor:null,sort:{key:'name',dir:1},filter:'',busy:false};
const fmtSize=n=>{if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<3);return n.toFixed(n<10?2:n<100?1:0)+' '+u[i]};
const fmtTime=s=>{if(!s)return'';const d=new Date(s*1000);const p=v=>String(v).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
const fmtDur=ms=>ms<1000?Math.round(ms)+' ms':ms<60000?(ms/1000).toFixed(1)+' 秒':Math.floor(ms/60000)+' 分 '+Math.round(ms%60000/1000)+' 秒';
const mbs=(bytes,ms)=>ms>0?bytes/ms/1000:0;
const join=(dir,name)=>dir.replace(/\/$/,'')+'/'+name;
const parent=p=>p.slice(0,p.lastIndexOf('/'));

function withTimeout(ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return{signal:c.signal,done:()=>clearTimeout(t)}}
async function api(url,post,ms){const w=withTimeout(ms||30000);try{const r=await fetch(url,{method:post?'POST':'GET',signal:w.signal});let j={};try{j=await r.json()}catch(e){if(!r.ok)j={error:'failed'}}if(!r.ok||j.error){const err=new Error(say_error(j.error));err.code=j.error;throw err}return j}finally{w.done()}}

/* ---- dialogs ---- */

/* ---- volumes ---- */
const VOL={internal:['内置存储','drive'],m2:['M.2 扩展硬盘','chip'],'usb-extended':['USB 扩展存储','usb'],extended:['扩展存储','drive'],usb:['外接硬盘','usb']};

async function loadVolumes(){const j=await api('/fs/volumes');S.volumes=j.volumes;const box=$('vols');box.textContent='';S.volumes.forEach(v=>{const used=v.total?Math.min(100,(v.total-v.free)/v.total*100):0;const b=el('button','vol');b.dataset.path=v.path;const top=el('div','vol-top');top.append(icon((VOL[v.kind]||VOL.extended)[1]),document.createTextNode(volName(v)));const sub=el('div','vol-sub');sub.append(el('span','mono',v.path),el('span','',v.format));const bar=el('div','usage');const fill=el('i',used>92?'full':'');fill.style.width=used.toFixed(1)+'%';bar.append(fill);b.append(top,sub,bar,el('div','vol-foot num','可用 '+fmtSize(v.free)+'，共 '+fmtSize(v.total)));b.onclick=()=>go(v.path);box.append(b)});markVolume()}

/* ---- the list ---- */
async function go(path,keep){if(S.busy)return;S.busy=true;try{const j=await api('/fs/list?path='+q(path));S.path=path;S.entries=j.entries;if(!keep)S.selected=new Set();S.truncated=j.truncated;try{history.replaceState(null,'','#'+encodeURI(path))}catch(e){}$('filter').value=keep?$('filter').value:'';S.filter=$('filter').value.toLowerCase();crumbs();render();markVolume()}catch(e){fail(e);if(!S.path&&S.volumes[0]&&path!==S.volumes[0].path){S.busy=false;return go(S.volumes[0].path)}}finally{S.busy=false}}
function crumbs(){const box=$('crumbs');box.textContent='';const v=volOf(S.path);if(!v)return;const add=(label,p)=>{const b=el('button','',label);b.onclick=()=>go(p);box.append(b)};add(volName(v),v.path);let at=v.path;S.path.slice(v.path.length).split('/').filter(Boolean).forEach(part=>{at+='/'+part;box.append(el('span','','/'));add(part,at)})}
function visible(){const f=S.filter;let list=S.entries.filter(e=>!f||e.name.toLowerCase().includes(f));const{key,dir}=S.sort;list.sort((a,b)=>{const fa=a.kind==='folder',fb=b.kind==='folder';if(fa!==fb)return fa?-1:1;const r=key==='name'?a.name.localeCompare(b.name,'zh',{numeric:true}):a[key]-b[key];return r*dir||a.name.localeCompare(b.name,'zh')});return list}
function render(){const body=$('items'),rows=document.createDocumentFragment(),list=visible();S.shown=list;list.forEach(e=>rows.append(rowFor(e)));body.textContent='';body.append(rows);const empty=$('empty');empty.hidden=list.length>0;if(!list.length){empty.textContent='';empty.append(icon(S.filter?'search':'folder'),el('div','',S.filter?'没有匹配的项目':'空文件夹，拖入即可上传'))}document.querySelectorAll('th button').forEach(b=>{const on=b.dataset.sort===S.sort.key;const base={name:'名称',size:'大小',mtime:'修改时间'}[b.dataset.sort];b.textContent=base+(on?(S.sort.dir>0?' ↑':' ↓'):'')});selectionChanged()}
function rowFor(e){const tr=el('tr'+'');tr.dataset.name=e.name;const check=el('td'),box=el('input');box.type='checkbox';box.tabIndex=-1;box.setAttribute('aria-label','选择 '+e.name);check.append(box);box.onclick=ev=>{ev.stopPropagation();toggle(e.name,ev)};const cellName=el('td'),name=el('div','nm');cellName.append(name);name.append(icon(e.kind==='folder'?'folder':e.kind==='link'?'link':'file',e.kind==='folder'?'folder':''));if(e.kind==='folder'){const a=el('a','',e.name);a.href='#'+encodeURI(join(S.path,e.name));a.onclick=ev=>{ev.preventDefault();ev.stopPropagation();go(join(S.path,e.name))};name.append(a)}else{name.append(el('span','',e.name));name.title=e.name}if(e.kind==='link')name.append(el('span','link-tag','链接'));if(e.kind==='other')name.append(el('span','link-tag','特殊'));tr.append(check,cellName,el('td','r num mut',e.kind==='folder'?'—':fmtSize(e.size)),el('td','r num mut c-time',fmtTime(e.mtime)));tr.onclick=ev=>clickRow(e.name,ev);tr.ondblclick=()=>{if(e.kind==='folder')go(join(S.path,e.name))};tr.oncontextmenu=ev=>{ev.preventDefault();if(!S.selected.has(e.name)){S.selected=new Set([e.name]);paint()}menuAt(ev.clientX,ev.clientY)};return tr}
function clickRow(name,ev){if(ev.shiftKey&&S.anchor){const order=S.shown.map(e=>e.name),a=order.indexOf(S.anchor),b=order.indexOf(name);if(a>=0&&b>=0){const[lo,hi]=a<b?[a,b]:[b,a];S.selected=new Set(order.slice(lo,hi+1))}}else if(ev.ctrlKey||ev.metaKey){toggle(name,ev);return}else{S.selected=new Set([name]);S.anchor=name}paint()}
function toggle(name){if(S.selected.has(name))S.selected.delete(name);else S.selected.add(name);S.anchor=name;paint()}
function paint(){document.querySelectorAll('#items tr').forEach(tr=>{const on=S.selected.has(tr.dataset.name);tr.classList.toggle('on',on);tr.firstChild.firstChild.checked=on});selectionChanged()}
function selectionChanged(){const n=S.selected.size,sel=selected();['act-down','act-copy','act-move','act-del'].forEach(id=>$(id).disabled=!n);$('act-rename').disabled=n!==1;const all=$('all');all.checked=n>0&&n===S.shown.length;all.indeterminate=n>0&&n<S.shown.length;const files=S.entries.filter(e=>e.kind!=='folder').length,folders=S.entries.length-files;const size=(n?sel:S.entries).reduce((s,e)=>s+(e.kind==='folder'?0:e.size),0);$('count').textContent=(n?'已选 '+n+' 项，':folders+' 个文件夹，'+files+' 个文件，')+fmtSize(size)+(S.truncated?'（只显示前 20000 项）':'')}
const selected=()=>S.entries.filter(e=>S.selected.has(e.name));

/* ---- actions ---- */
async function makeFolder(){const n=await promptName('新建文件夹','新建文件夹','创建');if(n===null)return;if(!validName(n))return toast('这个名字不能用',true);try{await api('/fs/mkdir?path='+q(join(S.path,n)),true);await go(S.path,true)}catch(e){fail(e)}}
async function renameOne(){const e=selected()[0];if(!e)return;const n=await promptName('重命名',e.name,'重命名');if(n===null||n===e.name)return;if(!validName(n))return toast('这个名字不能用',true);try{await api('/fs/rename?from='+q(join(S.path,e.name))+'&to='+q(join(S.path,n)),true);S.selected=new Set([n]);await go(S.path,true)}catch(err){fail(err)}}
async function removeSelected(){const list=selected();if(!list.length)return;const folders=list.filter(e=>e.kind==='folder').length;const ok=await modal('删除 '+list.length+' 项？',body=>{body.append(el('div','',folders?'文件夹里的所有内容都会被删除。这不能撤销。':'这不能撤销。'));names(body,list.map(e=>e.name))},[CANCEL,{text:'删除',cls:'primary',value:true}]);if(!ok)return;for(const e of list)try{await api('/fs/delete?path='+q(join(S.path,e.name)),true,600000)}catch(err){toast(e.name+'：'+err.message,true);break}await refresh()}
function download(){selected().forEach((e,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=(e.kind==='folder'?'/fs/tar?path=':'/fs/get?path=')+q(join(S.path,e.name));a.download='';document.body.append(a);a.click();a.remove()},i*400))}
async function info(){const list=selected();if(list.length!==1)return;const e=list[0],p=join(S.path,e.name);let extra=e.kind==='folder'?'正在计算…':fmtSize(e.size)+'（'+e.size.toLocaleString()+' 字节）';await modal(e.name,body=>{const line=el('div','num',extra);const where=el('div','mono',p);where.style.wordBreak='break-all';where.style.marginTop='6px';body.append(line,where,el('div','mut',fmtTime(e.mtime)));if(e.kind==='folder')api('/fs/size?path='+q(p),false,120000).then(j=>{line.textContent=fmtSize(j.bytes)+'，'+j.files+' 个文件'}).catch(err=>{line.textContent=err.message})},[{text:'关闭',value:true,cls:'primary'}])}
async function refresh(){try{await loadVolumes()}catch(e){}await go(S.path,true)}
function menuAt(x,y){const m=$('menu');m.textContent='';const n=S.selected.size,one=n===1?selected()[0]:null;const add=(ic,label,fn,cls,off)=>{const b=el('button',cls||'');b.append(icon(ic),document.createTextNode(label));b.disabled=!!off;b.onclick=()=>{hideMenu();fn()};m.append(b)};if(one&&one.kind==='folder')add('folder','打开',()=>go(join(S.path,one.name)));add('down','下载',download);add('edit','重命名',renameOne,'',n!==1);add('copy','复制到…',()=>transfer(false));add('move','移动到…',()=>transfer(true));add('info','详情',info,'',n!==1);m.append(el('hr'));add('trash','删除',removeSelected,'danger');m.classList.add('on');const w=m.offsetWidth,h=m.offsetHeight;m.style.left=Math.min(x,innerWidth-w-8)+'px';m.style.top=Math.min(y,innerHeight-h-8)+'px'}
const hideMenu=()=>$('menu').classList.remove('on');

/* ---- transfers: one at a time, so that each speed is that file's ---- */
const VERB={upload:'上传：',download:'下载：',copy:'复制：',move:'移动：'};
const CLIENT=Math.random().toString(36).slice(2,12)||'page';
const T={tasks:[],running:false,cancel:null,samples:[],last:0,lastAt:0,hist:[],batchBytes:0,batchMs:0,timer:null,seq:0};
function addTask(kind,name,size,run,state){const t={id:++T.seq,kind,name,size,run,done:0,state:state||'wait',node:null};T.tasks.push(t);drawTask(t);$('dock').classList.add('on');pump();return t}
const STATES={wait:'等待',run:'传输中',sync:'正在落盘',done:'完成',fail:'失败',skip:'已跳过',stop:'已取消'};
function drawTask(t){if(!t.node){const tr=el('tr');const nm=el('td');nm.title=t.name;tr.append(nm,el('td','num mut'),el('td','t-prog'),el('td','num'),el('td','num mut t-sync'),el('td'),el('td'));tr.children[0].textContent=t.name;const bar=el('div','bar');bar.append(el('i'));tr.children[2].append(bar);const x=el('button','quiet');x.append(icon('x'));x.title='取消';x.setAttribute('aria-label','取消 '+t.name);x.style.padding='2px';x.onclick=()=>stopTask(t);tr.children[6].append(x);$('tasks').append(tr);t.node=tr}const c=t.node.children;const pct=t.size?Math.min(100,t.done/t.size*100):0;c[1].textContent=fmtSize(t.size||t.done);c[2].firstChild.firstChild.style.width=(t.size?pct:t.state==='done'?100:0)+'%';c[3].textContent=t.rate&&t.size>=1048576?t.rate.toFixed(0)+' MB/s':'';c[4].textContent=t.sync!==undefined?'落盘 '+fmtDur(t.sync):'';const s=c[5];s.textContent=t.note||(t.state==='run'&&t.size?pct.toFixed(pct<10?1:0)+'%':STATES[t.state]);s.className=t.state==='done'?'good':t.state==='fail'?'bad':t.state==='sync'?'warn':'mut';s.title=t.note||'';c[6].firstChild.hidden=t.remote||!(t.state==='wait'||t.state==='run')}
function stopTask(t){if(t.state==='wait'){t.state='stop';drawTask(t)}else if(t.state==='run'&&T.cancel)T.cancel()}
async function pump(){if(T.running)return;T.running=true;$('cancel-all').hidden=false;$('dock-close').hidden=true;T.samples=[];T.batchStart=performance.now();T.batchBytes=0;T.timer=setInterval(sample,250);T.last=0;for(;;){const t=T.tasks.find(x=>x.state==='wait');if(!t)break;t.state='run';T.current=t;T.started=performance.now();T.last=0;T.lastAt=T.started;drawTask(t);try{await t.run(t);if(t.state==='run'||t.state==='sync')t.state='done'}catch(e){if(e.name==='AbortError'||e.code==='canceled'){t.state='stop'}else{t.state='fail';t.note=e.message}}T.batchBytes+=t.done;drawTask(t);T.current=null}clearInterval(T.timer);T.running=false;$('cancel-all').hidden=true;$('dock-close').hidden=false;finishBatch();refresh()}
function totals(){const all=T.tasks.filter(x=>x.state!=='skip'&&x.state!=='stop'),total=all.reduce((s,x)=>s+x.size,0),done=all.reduce((s,x)=>s+(x.state==='done'?x.size:x.done),0);const pct=total?Math.min(100,done/total*100):0;$('overall').style.width=pct+'%';$('st-sum').textContent=(total?pct.toFixed(pct<10?1:0)+'%，':'')+fmtSize(done)+' / '+fmtSize(total)+'，'+all.filter(x=>x.state==='done').length+' / '+all.length+' 项'}
function sample(){const t=T.current,now=performance.now();let rate=0;if(t&&t.state==='run'){const dt=now-T.lastAt;rate=mbs(t.done-T.last,dt);T.last=t.done;T.lastAt=now;t.rate=mbs(t.done,now-T.started);drawTask(t)}T.samples.push(rate);if(T.samples.length>120)T.samples.shift();const recent=T.samples.slice(-6);const shown=recent.reduce((a,b)=>a+b,0)/recent.length;$('rate').textContent=shown>=100?shown.toFixed(0):shown.toFixed(1);$('gbit').textContent=(shown*8/1000).toFixed(2)+' Gbit/s';if(t){const left=t.size-t.done,eta=t.rate>0?left/1e6/t.rate*1000:0;$('st-now').textContent=t.state==='sync'?'正在落盘…':(t.rate?t.rate.toFixed(0)+' MB/s，剩 '+fmtDur(eta):'')}totals();draw()}
function finishBatch(){const ms=performance.now()-T.batchStart,avg=mbs(T.batchBytes,ms);$('rate').textContent=avg>=100?avg.toFixed(0):avg.toFixed(1);$('gbit').textContent='本批平均 '+(avg*8/1000).toFixed(2)+' Gbit/s';$('st-now').textContent='用时 '+fmtDur(ms)+(T.tasks.some(t=>t.state==='fail')?'，有失败项':'');totals();draw()}
function draw(){const c=$('spark'),w=c.clientWidth;if(!w)return;const r=devicePixelRatio||1,h=52;if(c.width!==Math.round(w*r)){c.width=Math.round(w*r);c.height=h*r}const g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);g.clearRect(0,0,w,h);const s=T.samples;if(s.length<2)return;const peak=Math.max.apply(null,s.concat([1]));const X=i=>w-(s.length-1-i)*w/119,Y=v=>h-3-(v/peak)*(h-10);g.beginPath();s.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.strokeStyle='#7ce7e3';g.lineWidth=2;g.lineJoin='round';g.stroke();g.lineTo(w,h);g.lineTo(X(0),h);g.closePath();g.fillStyle='rgba(124,231,227,.16)';g.fill()}
function upload(t,file,path,overwrite){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();T.cancel=()=>x.abort();const fail2=()=>{const e=new Error(x.response&&x.response.error?say_error(x.response.error):'连接断开了');reject(e)};x.open('POST','/fs/put?path='+q(path)+'&client='+CLIENT+(overwrite?'&overwrite=1':''));x.responseType='json';x.upload.onprogress=e=>{t.done=e.loaded};x.upload.onload=()=>{t.done=t.size;t.wire=performance.now()-T.started;t.rate=mbs(t.size,t.wire);t.state='sync';drawTask(t)};x.onload=()=>{if(x.status!==200)return fail2();const j=x.response||{};t.sync=j.sync_ms||0;t.state='done';if(t.size>=1048576)t.note=mbs(j.bytes,j.ms+j.sync_ms).toFixed(0)+' MB/s 含落盘';resolve()};x.onerror=fail2;x.onabort=()=>{const e=new Error('canceled');e.code='canceled';reject(e)};x.send(file)})}

/* Lists what the drop holds. Entries read in batches; a folder gives at most 100 at a time. */
const readAll=reader=>new Promise((resolve,reject)=>{const all=[];const next=()=>reader.readEntries(batch=>{if(!batch.length)return resolve(all);all.push.apply(all,batch);next()},reject);next()});
const asFile=entry=>new Promise((resolve,reject)=>entry.file(resolve,reject));
async function walk(entry,prefix,out){if(entry.isFile){out.files.push({file:await asFile(entry),rel:prefix+entry.name})}else if(entry.isDirectory){out.dirs.push(prefix+entry.name);for(const c of await readAll(entry.createReader()))await walk(c,prefix+entry.name+'/',out)}}
async function startUpload(found){const dest=S.path;if(!dest||!found.files.length&&!found.dirs.length)return;const seen=new Map();const has=async dir=>{if(!seen.has(dir)){try{seen.set(dir,new Set((await api('/fs/list?path='+q(dir))).entries.map(e=>e.name)))}catch(e){seen.set(dir,new Set())}}return seen.get(dir)};const clashes=[];for(const f of found.files){const p=join(dest,f.rel);if((await has(parent(p))).has(baseName(p)))clashes.push(f)}const total=found.files.reduce((s,f)=>s+f.file.size,0),v=volOf(dest);if(v&&total>v.free){toast('目标硬盘放不下：要 '+fmtSize(total)+'，可用 '+fmtSize(v.free),true);return}let overwrite=false,skip=new Set();if(clashes.length){const choice=await modal(clashes.length+' 个文件已经存在',body=>{body.append(el('div','','覆盖会替换原文件。上传完成前原文件不动。'));names(body,clashes.map(f=>f.rel))},[CANCEL,{text:'跳过这些',value:'skip'},{text:'全部覆盖',cls:'primary',value:'over'}]);if(!choice)return;if(choice==='over')overwrite=true;else skip=new Set(clashes)}for(const d of found.dirs.slice().sort((a,b)=>a.length-b.length))try{await api('/fs/mkdir?path='+q(join(dest,d)),true)}catch(e){if(e.code!=='exists'){toast(d+'：'+e.message,true);return}}found.files.forEach(f=>addTask('up',f.rel,f.file.size,x=>upload(x,f.file,join(dest,f.rel),overwrite),skip.has(f)?'skip':null));if(found.dirs.length&&!found.files.length)refresh()}
async function fromDrop(items){const out={files:[],dirs:[]},entries=[];for(let i=0;i<items.length;i++){const it=items[i];if(it.kind!=='file')continue;const e=it.webkitGetAsEntry&&it.webkitGetAsEntry();if(e)entries.push(e);else{const f=it.getAsFile();if(f)out.files.push({file:f,rel:f.name})}}for(const e of entries)await walk(e,'',out);startUpload(out)}
function fromPicker(input){const out={files:[],dirs:[]},dirs=new Set();Array.from(input.files).forEach(f=>{const rel=f.webkitRelativePath||f.name;out.files.push({file:f,rel});const parts=rel.split('/');for(let i=1;i<parts.length;i++)dirs.add(parts.slice(0,i).join('/'))});out.dirs=Array.from(dirs);input.value='';startUpload(out)}
async function transfer(move){const list=selected();if(!list.length)return;const dest=await pickFolder((move?'移动 ':'复制 ')+list.length+' 项到',move?'移动到这里':'复制到这里',S.path);if(!dest)return;if(dest===S.path)return toast('目标就是当前文件夹',true);list.forEach(e=>{const from=join(S.path,e.name),to=join(dest,e.name);addTask(move?'move':'copy',VERB[move?'move':'copy']+e.name,e.kind==='folder'?0:e.size,t=>runJob(t,from,to,move))})}
async function runJob(t,from,to,move){const r=await api('/fs/'+(move?'move':'copy')+'?from='+q(from)+'&to='+q(to)+'&client='+CLIENT,true);if(r.instant){t.done=t.size;t.note='已完成（同一硬盘）';return}let stop=false;T.cancel=()=>{stop=true;api('/fs/cancel',true).catch(()=>{})};for(;;){await new Promise(res=>setTimeout(res,400));const j=await api('/fs/job');if(j.total)t.size=j.total;t.done=j.done;if(j.state==='done'){t.rate=mbs(j.done,j.ms);return}if(j.state==='canceled'){const e=new Error('canceled');e.code='canceled';throw e}if(j.state==='failed')throw new Error(say_error(j.error));if(stop&&j.state==='idle')return}}

/* ---- wiring ---- */
$('up-files').onclick=()=>$('pick-files').click();$('up-folder').onclick=()=>$('pick-folder').click();$('pick-files').onchange=e=>fromPicker(e.target);$('pick-folder').onchange=e=>fromPicker(e.target);
$('mkdir').onclick=makeFolder;$('act-rename').onclick=renameOne;$('act-del').onclick=removeSelected;$('act-down').onclick=download;$('act-copy').onclick=()=>transfer(false);$('act-move').onclick=()=>transfer(true);$('refresh').onclick=refresh;
$('filter').oninput=e=>{S.filter=e.target.value.toLowerCase();render()};
$('all').onclick=e=>{S.selected=new Set(e.target.checked?S.shown.map(x=>x.name):[]);paint()};
document.querySelectorAll('th button').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;if(S.sort.key===k)S.sort.dir*=-1;else S.sort={key:k,dir:1};render()});
$('cancel-all').onclick=()=>{T.tasks.forEach(t=>{if(t.state==='wait'){t.state='stop';drawTask(t)}});if(T.cancel&&T.current)T.cancel()};
$('dock-close').onclick=()=>{$('dock').classList.remove('on');T.tasks=T.tasks.filter(t=>t.state==='wait'||t.state==='run');$('tasks').textContent='';T.tasks.forEach(t=>{t.node=null;drawTask(t)})};
let dragDepth=0;const hasFiles=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth++;$('drop-path').textContent=S.path;$('drop').classList.add('on')});
addEventListener('dragover',e=>{if(hasFiles(e)){e.preventDefault();e.dataTransfer.dropEffect='copy'}});
addEventListener('dragleave',e=>{if(hasFiles(e)&&--dragDepth<=0){dragDepth=0;$('drop').classList.remove('on')}});
addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;$('drop').classList.remove('on');if($('tab-bench').getAttribute('aria-selected')==='true')showTab('files');fromDrop(e.dataTransfer.items)});
addEventListener('click',e=>{if(!e.target.closest('#menu'))hideMenu()});
addEventListener('beforeunload',e=>{if(T.running){e.preventDefault();e.returnValue=''}});
addEventListener('keydown',e=>{if(e.key==='Escape'){hideMenu();if(closeModal)closeModal();return}const typing=/^(INPUT|TEXTAREA)$/.test(e.target.tagName);if(typing||closeModal)return;if(e.key==='Delete')removeSelected();else if(e.key==='F2')renameOne();else if((e.ctrlKey||e.metaKey)&&e.key==='a'&&$('view-files').classList.contains('on')){e.preventDefault();S.selected=new Set(S.shown.map(x=>x.name));paint()}else if(e.key==='Backspace'&&volOf(S.path)&&volOf(S.path).path!==S.path){e.preventDefault();go(parent(S.path))}});
function showTab(name){['files','bench'].forEach(n=>{$('tab-'+n).setAttribute('aria-selected',n===name);$('view-'+n).classList.toggle('on',n===name)})}
$('tab-files').onclick=()=>showTab('files');$('tab-bench').onclick=()=>showTab('bench');
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');setTheme(cur==='dark'?'light':'dark')};

/* ---- the disks ---- */
const rate=m=>(m/8).toFixed(0)+' MB/s，'+(m/1000).toFixed(2)+' Gbit/s';
async function disks(){const b=$('disk-go');b.disabled=true;const box=$('disk-rows');box.textContent='';await loadVolumes().catch(()=>{});for(const v of S.volumes){const t=el('tr');[volName(v),'','','正在测…'].forEach(x=>t.append(el('td','',x)));box.append(t);try{const j=await api('/fs/bench?path='+q(v.path),true,600000);t.children[1].textContent=rate(j.write);t.children[2].textContent=rate(j.read);t.children[3].textContent=j.direct?'绕过缓存':'经过缓存，读取可能偏快'}catch(e){t.children[3].textContent=e.message;t.children[3].className='bad'}}b.disabled=false}
$('disk-go').onclick=disks;

/* ---- what other pages and computers are moving ---- */
const R={seen:new Set(),tasks:new Map(),at:0,fails:0,first:true,tick:0,active:false,busy:false};
function showRate(shown){$('rate').textContent=shown>=100?shown.toFixed(0):shown.toFixed(1);$('gbit').textContent=(shown*8/1000).toFixed(2)+' Gbit/s'}
function remote(list){const now=performance.now(),live=new Set();let moved=0,active=0,again=false;for(const x of list){live.add(x.id);if(x.client===CLIENT)continue;let t=R.tasks.get(x.id);if(!t){if(R.seen.has(x.id))continue;R.seen.add(x.id);if(x.state!=='active'){again=!R.first;continue}t={id:'r'+x.id,kind:x.kind==='upload'?'up':x.kind,name:(VERB[x.kind]||'')+x.name,size:x.size,done:x.done,state:'run',remote:true,node:null};T.tasks.push(t);R.tasks.set(x.id,t);$('dock').classList.add('on')}moved+=Math.max(0,x.done-t.done);t.size=x.size;t.done=x.done;t.rate=mbs(x.done,x.ms);if(x.state==='active'){active++;t.state=x.kind==='upload'&&x.size&&x.done>=x.size?'sync':'run'}else{if(!t.size)t.size=t.done;t.state=x.state==='done'?'done':'fail';if(t.state==='fail')t.note='已中断';R.tasks.delete(x.id);again=true}drawTask(t)}for(const[id,t]of R.tasks)if(!live.has(id)){t.state='fail';t.note='已中断';drawTask(t);R.tasks.delete(id);again=true}const dt=now-R.at;R.at=now;if(!T.running){if(active){T.samples.push(dt>0?moved/dt/1000:0);if(T.samples.length>120)T.samples.shift();const recent=T.samples.slice(-3);showRate(recent.reduce((a,b)=>a+b,0)/recent.length);$('st-now').textContent=active+' 个传输进行中';$('dock-close').hidden=true;totals();draw()}else if(R.active){showRate(0);$('st-now').textContent='已完成';$('dock-close').hidden=false;totals();draw()}}R.active=active>0;R.first=false;if(again&&!T.running)refresh()}
async function poll(){if(document.hidden||R.busy||$('ended').classList.contains('on'))return;R.busy=true;try{const j=await api('/fs/transfers',false,5000);remote(j.transfers);if(R.fails>=3||++R.tick%10===0)loadInfo();R.fails=0}catch(e){if(++R.fails===3){$('net').textContent='已断开';$('net-dot').classList.remove('on');$('net-dot').classList.add('off')}}R.busy=false}

async function end(){const ok=await modal('退出？',body=>{body.append(el('div','','恢复网卡并关闭端口，进行中的传输会中断。'))},[CANCEL,{text:'退出',cls:'primary',value:true}]);if(!ok)return;try{await fetch('/api/exit',{method:'POST'})}catch(e){}$('ended').classList.add('on')}
$('end').onclick=end;

/* ---- the icon ---- */
const TILE={idle:'图标：未添加',working:'图标：处理中',installed:'图标：已在主屏幕',removed:'图标：已移除',failed:'图标：未能添加'};
async function tile(){try{const j=await api('/tile/status');S.tile=j;$('tile-text').textContent=TILE[j.state]||'图标';if(j.state==='working')setTimeout(tile,2000)}catch(e){}}
$('tile-chip').onclick=async()=>{await tile();const on=S.tile&&S.tile.state==='installed';const failed=S.tile&&S.tile.state==='failed';const choice=await modal('主屏幕图标',body=>{body.append(el('div','',on?'插件运行时可从图标打开本页。主机重启后需重新运行插件。':failed?'添加失败：'+S.tile.error:'添加后可从主机主屏幕打开本页。'))},on?[CANCEL,{text:'从主机移除',value:'remove'}]:[CANCEL,{text:'添加到主屏幕',cls:'primary',value:'add'}]);if(!choice)return;try{if(choice==='remove'){const j=await api('/tile/remove',true,60000);toast(j.state==='removed'?'图标已移除':'移除失败：'+j.error,j.state!=='removed')}else await api('/tile/install',true)}catch(e){fail(e)}tile()};

/* ---- start ---- */
const RATES=[[1000,'1G'],[2500,'2.5G'],[5000,'5G'],[10000,'10Gbps']];
function loadInfo(){return fetch('/api/info').then(r=>r.json()).then(j=>{const n=$('net');n.textContent=j.ip+' · ';RATES.forEach(([m,label],i)=>{if(i)n.append('/');n.append(m===j.link_mbps?el('b','',label):el('span','off-rate',label))});if(j.link_mbps&&j.link_mbps<1000)n.append(' · ',el('b','',j.link_mbps+'M'));n.append(' · v'+j.version);$('net-dot').classList.remove('off');$('net-dot').classList.add('on')}).catch(()=>{$('net').textContent='连接失败';$('net-dot').classList.remove('on');$('net-dot').classList.add('off')})}
loadInfo();
(async()=>{try{await loadVolumes();const h=decodeURI(location.hash.slice(1));const start=h&&volOf(h)?h:S.volumes[0]&&S.volumes[0].path;if(start)await go(start);else $('count').textContent='没有找到存储位置'}catch(e){fail(e)}tile();poll();setInterval(poll,1000)})();
</script>
